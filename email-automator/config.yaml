# Who the emails will come from
sender_account: ubcbiomod@gmail.com

# Files in this same folder (or a full path if they live somewhere else)
csv_file: recipients.csv
template_file: template.docx

# Email subject line. You can use the same {{placeholders}} as in the Word template.
subject: "Hello {{first_name}}"

# Name for this batch. If you stop halfway and run again, already-sent people in
# this campaign are skipped so nobody gets a duplicate. Change this name when you
# start a brand-new email blast to the same people.
campaign: default

# Show this many sample emails on screen before sending.
preview_count: 2

# Pause between each send (seconds). Helps avoid Gmail treating it as spam.
delay_seconds: 1.5

# Personal Gmail accounts can send about 500 emails per day.
daily_limit: 500

# If true, the script only previews emails and does not send anything.
dry_run: false
